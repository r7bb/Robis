# Proposes a new digest for each pinned base image (the FROM lines in
# deploy/docker), once a week. CI builds and scans the proposed images on
# the pull request before anything is merged (stage 4, item 38).
#
# Digests only: a new version of Bun or Python changes what CI and
# development run, and is a decision, not a weekly chore. Dependabot does
# not count a new digest for the same tag as a version update, so ignoring
# every version update leaves the digest updates in place.
version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
