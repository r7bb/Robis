name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token reads the repository and nothing else; no job here writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A service container rather than the npm-packaged Postgres used locally:
    # CI already has a container runtime, so there is no reason to reach for the
    # workaround that exists for machines that don't.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: robis
          POSTGRES_PASSWORD: robis
          POSTGRES_DB: robis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U robis -d robis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # An S3-compatible server for the storage driver's contract tests.
      # Adobe S3Mock (Apache-2.0), pinned; MinIO's image is no longer
      # published on Docker Hub. The bucket is created at start-up.
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: robis-test
        ports:
          - 9090:9090

    env:
      DATABASE_URL: postgres://robis:robis@localhost:5433/robis
      TEST_ADMIN_URL: postgres://robis:robis@localhost:5433/postgres
      TEST_DATABASE_URL: postgres://robis:robis@localhost:5433/robis_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Bun's download cache, keyed on the lockfile: an unchanged lockfile
      # installs from the runner's cache rather than the registry.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Frozen: CI installs exactly what bun.lock records, which lists every
      # platform's variant of the native packages (argon2, sharp, the
      # Postgres binaries), and fails if the lockfile is out of date.
      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      # Every relative link in every Markdown file must resolve, and every
      # path the app inventory names must exist.
      - name: Documentation links
        run: bun run docs:links

      # The same check against a fixture with a known broken link must fail,
      # so the step above is shown to catch breakage, not assumed to.
      - name: Documentation link check catches a broken link
        run: "! bun run scripts/docs/links.ts --root tests/fixtures/doc-links"

      - name: Typecheck
        run: bun run typecheck

      # No unused files, exports or dependencies (stage 4, item 35).
      - name: Unused code
        run: bun run knip

      # And against a fixture with a known unused export it must fail, so the
      # step above is shown to catch one.
      - name: Unused code check catches an unused export
        run: "! bun run knip --directory tests/fixtures/knip"

      # The image has no health command of its own, so wait for it to answer
      # before the tests that need it run.
      - name: Wait for S3Mock
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9090/ >/dev/null && exit 0
            sleep 2
          done
          echo "S3Mock did not start" && exit 1

      - name: Test
        run: bun test
        env:
          S3_ENDPOINT: http://localhost:9090
          S3_BUCKET: robis-test
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test

      # `bun --filter <pkg> <script>` -- inserting `run` makes Bun look for a
      # script literally named "run".
      - name: Build web
        run: bun --filter '@robis/web' build

  # The duplicate and priority service's own tests, on the Python it ships
  # with, from the locked set: the runtime pins of requirements.lock plus the
  # test tools, every package checked against its hash.
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robis-ml

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: robis-ml/requirements-dev.lock

      - name: Install the locked test environment
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock

      # From this folder, so the package is imported from the source here.
      - name: Test
        run: python -m pytest -q

  # Every service built as its container image, started together, and driven
  # end to end. This is where the container build is verified: here, on a
  # Linux runner, as well as on the development machine.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_FILE: deploy/compose.yaml
      # Pinned by digest, and run as an image rather than through a
      # third-party action, so the scanner never sees the job's token.
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each image's layers from the last run, one folder per image so they
      # never overwrite each other; a step whose inputs did not change is
      # restored rather than rebuilt. Saved under this commit, restored from
      # the newest earlier one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.os }}-

      # Bake from the compose file, run from deploy/ because it resolves the
      # build contexts from where it runs. Read access to the repository and
      # read and write access to the cache are granted explicitly. The one-shot
      # migrate and seed services share the API image, which `migrate` builds.
      - name: Build every image
        working-directory: deploy
        run: |
          set -- mail migrate realtime worker ml web
          args=""
          for image in "$@"; do
            args="$args --set $image.cache-from=type=local,src=/tmp/buildx-cache/$image"
            args="$args --set $image.cache-to=type=local,dest=/tmp/buildx-cache-new/$image,mode=max"
          done
          # shellcheck disable=SC2086
          docker buildx bake --allow=fs.read=.. --allow=fs=/tmp -f compose.yaml --load $args "$@"
          rm -rf /tmp/buildx-cache && mv /tmp/buildx-cache-new /tmp/buildx-cache

      # Each service installs only its own dependencies: the gateway and
      # the worker images must hold no sharp and no Fastify, and the API's
      # must hold both, which shows the search would find them.
      - name: Each image holds only its own service's dependencies
        run: bun run scripts/smoke/image-contents.ts

      # `--wait` returns non-zero if any service exits or fails its health
      # check, so an image that builds but does not run fails the job here.
      - name: Start the stack and wait for every health check
        run: docker compose up --detach --wait --wait-timeout 300

      # Needs no install: the script uses only what Bun provides.
      - name: Smoke test against the running containers
        run: bun run scripts/smoke/stack.ts

      # The runner's own Chrome, under the web app's security policy: every
      # page loads with no violation, injected markup does not run, and the
      # WebGL landing still draws (on the software renderer; there is no GPU).
      - name: Browser smoke test under the security policy
        run: bun run scripts/smoke/browser.ts

      # Health is checked at start-up by `--wait`; this checks it again
      # after real traffic, so a service that fell over during the smoke
      # test fails the job too.
      - name: Every service still healthy
        # Fields are service|state|health|exit code; health is empty for a
        # service without a check, which is why the separator is explicit.
        # The one-shot migrator and seed must have exited 0; everything else
        # must be running, and healthy if it has a check.
        run: |
          docker compose ps --all --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' \
            | tee services.txt
          awk -F'|' '
            $1 == "migrate" || $1 == "seed" { if ($2 != "exited" || $4 != "0") { print "not ok: " $0; bad = 1 }; next }
            $2 != "running" || ($3 != "" && $3 != "healthy") { print "not ok: " $0; bad = 1 }
            END { exit bad }' services.txt

      # The stack runs in development mode over plain http; this is the
      # production rule it cannot show. Both images must refuse to start.
      # The same stack as production runs it (stage 1, item 7): NODE_ENV=production
      # everywhere, HTTPS through the edge proxy with a throwaway certificate,
      # mail over STARTTLS, a fresh audit key and no demo data. Same smoke tests.
      - name: Restart the stack in production mode behind TLS
        env:
          COMPOSE_FILE: deploy/compose.yaml:deploy/compose.production.yaml
        run: |
          # A fresh signing key per run; the stack's own key id is refused here.
          # First: the production overlay needs it for every compose command.
          export CI_AUDIT_HMAC_KEYS="ci:$(openssl rand -base64 32)"
          echo "CI_AUDIT_HMAC_KEYS=$CI_AUDIT_HMAC_KEYS" >> "$GITHUB_ENV"
          docker compose down
          bun run scripts/smoke/throwaway-tls.ts
          docker compose up --detach --wait --wait-timeout 300

      - name: Smoke test in production mode, over HTTPS
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/deploy/.tls/ca.pem
          SMOKE_WEB_URL: https://127.0.0.1:8443
          SMOKE_WEB_ORIGIN: https://localhost:8443
        run: bun run scripts/smoke/stack.ts

      - name: Browser smoke test in production mode, over HTTPS
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/deploy/.tls/ca.pem
          SMOKE_WEB_URL: https://localhost:8443
          SMOKE_API_URL: https://127.0.0.1:8443/api
          SMOKE_IGNORE_CERT_ERRORS: '1'
        run: bun run scripts/smoke/browser.ts

      - name: Production refuses to start without a mail driver or an audit key
        run: |
          for image in api worker; do
            # Bounded: a regression that let it start would otherwise run
            # until the job's timeout.
            if timeout 60 docker run --rm -e NODE_ENV=production -e DATABASE_URL=postgres://none@none/none \
                 -e WEB_ORIGIN=https://robis.example -e MEDIA_DIR=/tmp/media \
                 "robis-${image}:stack" > "refusal-${image}.log" 2>&1; then
              echo "robis-${image} started in production with no mail driver" && exit 1
            fi
            grep -q "no production mail driver is configured" "refusal-${image}.log" \
              || { cat "refusal-${image}.log"; exit 1; }
          done
          # With mail configured, the API still refuses without an audit key.
          if timeout 60 docker run --rm -e NODE_ENV=production -e DATABASE_URL=postgres://none@none/none \
               -e WEB_ORIGIN=https://robis.example -e MEDIA_DIR=/tmp/media -e SMTP_HOST=smtp.example.com \
               robis-api:stack > refusal-audit-key.log 2>&1; then
            echo "robis-api started in production with no audit key" && exit 1
          fi
          grep -q "AUDIT_HMAC_KEYS is not set" refusal-audit-key.log \
            || { cat refusal-audit-key.log; exit 1; }

      # The browser bundle must not ship source maps, and no image may hold
      # an env file, whatever .dockerignore says.
      - name: Web image holds no source maps or env files
        run: |
          found=$(docker run --rm --entrypoint find robis-web:stack /app \
            \( -name '*.map' -o -name '.env*' \) -not -path '*/node_modules/*')
          if [ -n "$found" ]; then echo "$found"; exit 1; fi

      # Critical vulnerabilities that have a fix fail the build; ones with no
      # fix yet are not counted, since there is nothing to upgrade to. Any
      # secret found in a layer fails it too. Images are handed over as
      # tarballs, so the scanner gets no access to the Docker daemon, and
      # its database downloads once into a shared cache.
      - name: Scan every image (Trivy)
        run: |
          mkdir -p .trivy/images
          for image in api realtime worker web ml mail-sink; do
            docker save "robis-${image}:stack" -o ".trivy/images/${image}.tar"
            docker run --rm -v "$PWD/.trivy:/trivy" -e TRIVY_CACHE_DIR=/trivy/cache "$TRIVY_IMAGE" \
              image --quiet --scanners vuln,secret --severity CRITICAL --ignore-unfixed \
              --exit-code 1 --input "/trivy/images/${image}.tar"
          done

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
