[project]
name = "robis-ml"
version = "0.1.0"
description = "Duplicate detection and priority triage for Robis issues."
requires-python = ">=3.11"

dependencies = [
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "opentelemetry-sdk>=1.45",
    # Sentence embeddings for duplicates (D2): MIT and Apache-2.0.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# snowballstemmer (BSD-3-Clause) is for the stemming candidate in evaluation only.
dev = ["pytest>=8.3", "httpx>=0.27", "snowballstemmer>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robis_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
