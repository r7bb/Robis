<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robis can't be reached</title>
    <!-- Tries again by itself: the security policy refuses scripts here, and
         a refresh needs none. -->
    <meta http-equiv="refresh" content="10" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e1014;
        color: #cbd5e1;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 28rem; padding: 0 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 600; color: #fff; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.6; color: #94a3b8; margin: 0 0 1.5rem; }
      .retry {
        display: inline-block;
        text-decoration: none;
        border: 1px solid #252a33;
        background: #16191f;
        color: #e2e8f0;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        cursor: pointer;
      }
      .retry:hover { border-color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <h1>Robis can't be reached right now</h1>
      <p>
        Either this device has lost its connection, or Robis itself is down or
        restarting. This page tries again every ten seconds.
      </p>
      <p>
        Boards you have already opened still work offline, and changes made on
        them are kept on this device until they can be sent.
      </p>
      <!-- A form, not a script: sending it loads this address again. -->
      <form method="get">
        <button class="retry" type="submit">Try again</button>
      </form>
    </main>
  </body>
</html>
